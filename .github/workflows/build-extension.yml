name: Build GDExtension

on:
  workflow_dispatch:
  push:
    paths:
      - 'extension/godot_opcua/**.cpp'
      - 'extension/godot_opcua/**.h'
      - 'extension/godot_opcua/**.c'
      - 'extension/godot_opcua/SConstruct'
      - 'extension/godot-cpp/**'

permissions:
  actions: read
  contents: read

jobs:
  build-extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: pip install scons

      - name: Cache GDExtension Build
        uses: actions/cache@v4
        with:
          path: |
            extension/godot_opcua/.sconsign.dblite
            project/bin/
          key: gdextension-${{ runner.os }}-${{ hashFiles('extension/godot_opcua/**/*.cpp', 'extension/godot_opcua/**/*.h') }}
          restore-keys: |
            gdextension-${{ runner.os }}-

      - name: Build GDExtension
        working-directory: ./extension/godot_opcua
        run: |
          scons `
            platform=windows `
            target=template_debug `
            arch=x86_64

      - name: Upload GDExtension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-opcua-extension
          path: project/bin/
          retention-days: 90