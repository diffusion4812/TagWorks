name: Build Project

on:
  workflow_run:
    workflows:
      - "Build Godot"
      - "Build GDExtension"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  GODOT_VERSION: "4.7-stable"          # Tag format used in GitHub release URLs
  GODOT_TEMPLATE_DIR: "4.7.stable"     # Folder format Godot expects locally

jobs:
  build-project:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # ── Download Godot Editor ─────────────────────────────────────────────────

      - name: Download Godot Editor Artifact
        uses: dawidd6/action-download-artifact@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-godot.yml
          name: godot-editor-${{ env.GODOT_VERSION }}
          path: ./godot/
          if_no_artifact_found: fail

      # ── Download Official Export Templates (.tpz) ─────────────────────────────

      - name: Download Godot Export Templates (.tpz)
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile "templates.tpz"

      - name: Upload TPZ as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-templates-${{ env.GODOT_VERSION }}
          path: templates.tpz
          retention-days: 7

      - name: Install Export Templates
        shell: pwsh
        run: |
          $templateDir = "$env:APPDATA/Godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Expand-Archive -Path "templates.tpz" -DestinationPath "$env:TEMP/godot_templates" -Force
          Copy-Item "$env:TEMP/godot_templates/templates/*" $templateDir -Recurse -Force

      # ── Download GDExtension ──────────────────────────────────────────────────

      - name: Download GDExtension Artifact
        uses: dawidd6/action-download-artifact@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-extension.yml
          name: godot-opcua-extension
          path: ./bin/
          if_no_artifact_found: fail

      # ── Diagnose Environment ──────────────────────────────────────────────────

      - name: Diagnose Environment
        run: |
          Write-Host "=== Godot Binary ==="
          Get-ChildItem ./godot/

          Write-Host "=== Export Templates ==="
          $templateDir = "$env:APPDATA/Godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}"
          if (Test-Path $templateDir) {
            Get-ChildItem $templateDir
          } else {
            Write-Host "ERROR: Template directory missing!"
          }

          Write-Host "=== GDExtension Files ==="
          Get-ChildItem -Recurse ${{ github.workspace }}/project/bin/

          Write-Host "=== export_presets.cfg ==="
          Get-Content ${{ github.workspace }}/project/export_presets.cfg

          Write-Host "=== godot_opcua.gdextension ==="
          Get-Content ${{ github.workspace }}/project/bin/godot_opcua.gdextension

      # ── Export Project ────────────────────────────────────────────────────────

      - name: Export Project
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}/build
          $env:GODOT_DEBUG_GDEXTENSION = "1"
          ./godot/godot.windows.editor.x86_64.exe `
            --headless `
            --path ${{ github.workspace }}/project `
            --export-debug "win64" `
            ${{ github.workspace }}/build/tagview.exe 2>&1 | Tee-Object -FilePath "${{ github.workspace }}/godot_log.txt"

      - name: Upload Godot Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot Export Log
          path: ${{ github.workspace }}/godot_log.txt

      # ── Compress & Upload ─────────────────────────────────────────────────────

      - name: Install UPX
        run: choco install upx -y

      - name: Compress Executable Only (Side-by-Side Configuration)
        run: |
          $buildDir = "${{ github.workspace }}/build"

          if (Test-Path "$buildDir/tagview.exe") {
              Write-Host "Compressing engine runner..."
              upx --best --lzma "$buildDir/tagview.exe"
              Write-Host "SUCCESS: Executable compressed. Keeping tagview.pck side-by-side."
          } else {
              Write-Error "ERROR: tagview.exe not found!"
              exit 1
          }

      - name: List Build Directory Contents
        run: Get-ChildItem -Recurse ${{ github.workspace }}/build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Client - win64
          path: ${{ github.workspace }}/build/