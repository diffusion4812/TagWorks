name: Build

on:
  push: {}
  pull_request: {}

jobs:
  Godot:
    runs-on: windows-latest
    env:
      GODOT_VERSION: "4.6.3-stable"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot Executable
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ./godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_win64.exe.zip"
          unzip godot.zip -d ./godot

      - name: Cache Export Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ${{ env.APPDATA }}/Godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download and Install Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          $templateDir = "$env:APPDATA/Godot/export_templates/4.6.3.stable"
          New-Item -ItemType Directory -Force -Path $templateDir
          unzip templates.tpz -d ./templates_extracted
          Move-Item -Path ./templates_extracted/templates/* -Destination $templateDir

      - name: Diagnose Environment
        run: |
          Write-Host "=== Godot Binary ==="
          Get-ChildItem ./godot/

          Write-Host "=== Export Templates ==="
          $templateDir = "$env:APPDATA/Godot/export_templates/4.6.3.stable"
          if (Test-Path $templateDir) {
            Get-ChildItem $templateDir
          } else {
            Write-Host "ERROR: Template directory missing!"
          }

          Write-Host "=== GDExtension Files ==="
          Get-ChildItem -Recurse ${{ github.workspace }}/bin/

          Write-Host "=== export_presets.cfg ==="
          Get-Content ${{ github.workspace }}/export_presets.cfg

          Write-Host "=== godot_opcua.gdextension ==="
          Get-Content ${{ github.workspace }}/bin/godot_opcua.gdextension

      - name: Export Project
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}/build
          $env:GODOT_DEBUG_GDEXTENSION = "1"
          ./godot/Godot_v${{ env.GODOT_VERSION }}_win64.exe `
            --headless `
            --verbose `
            --debug-stringnames `
            --path ${{ github.workspace }} `
            --export-debug "win64" `
            ${{ github.workspace }}/build/tagview.exe 2>&1 | Tee-Object -FilePath "${{ github.workspace }}/godot_log.txt"

      - name: Upload Godot Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot Export Log
          path: ${{ github.workspace }}/godot_log.txt

      - name: List Build Directory
        run: Get-ChildItem -Recurse ${{ github.workspace }}/build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Client - win64
          path: ${{ github.workspace }}/build/